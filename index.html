<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Under Maintenance</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #000000;
            overflow: hidden;
            font-family: 'Rubik', sans-serif;
        }
        
        /* Positioned the logo wrapper at the top-most left side */
        #navbar {
            position: fixed;
            top: 24px;   /* Sets spacing from the top edge */
            left: 24px;  /* Sets spacing from the left edge */
            z-index: 10; /* Keeps it above the blur and text overlay layers */
        }

        #navbar img {
            max-height: 50px; /* Adjust this value to resize the logo layout */
            width: auto;
            display: block;
        }

        .content {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh; 
            width: 100vw;
            box-sizing: border-box;
        }

        .text-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 0 40px;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background: transparent;
            z-index: 2;
        }

        h1 {
            position: relative;
            font-size: 2em;
            color: #ffffff;
            z-index: 3;
            line-height: 1.4;
            margin: 0;
        }

        #block-container {
            position: absolute;
            width: 800px; 
            height: 650px; 
            z-index: 1;
        }

        @keyframes rotate {
            from { rotate: 0deg; }
            50% { scale: 1 1.5; }
            to { rotate: 360deg; }
        }

        #block {
            background-color: white;
            height: 34vmax;
            aspect-ratio: 1;
            position: absolute;
            left: 50%;
            top: 50%;
            translate: -50% -50%;
            border-radius: 50%;
            background: linear-gradient(45deg, rgb(29, 14, 236), rgb(0, 247, 255));
            animation: rotate 20s infinite;
            opacity: 0.8;
        }

        #blur {
            height: 100%;
            width: 100%;
            position: absolute;
            z-index: 2;
            backdrop-filter: blur(16vmax);
        }
    </style>
</head>
<body>

    <div id="blur"></div>
    <div class="overlay"></div>

    <!-- Top Left Floating Logo -->
    <div id="navbar">
        <img src="https://cs-maint.pages.dev/ptcbannerwhite.png" alt="Philtrust Bank logo" title="Philtrust Bank Maintenance Page">
    </div>

    <!-- Centered Maintenance Message Layout -->
    <div class="content">
        <div class="text-content">
            <h1>The <span class="effect" data-value="Philtrust Bank Corporate Site">Philtrust Bank Corporate Site</span> is under routine upgrades and maintenance. <br /> Please check back in a little while. </h1>
        </div>
    </div>

    <div id="block-container">
        <div id="block"></div>
    </div>

    <script>
        const blockContainer = document.getElementById('block-container');
        let targetX = 0; let targetY = 0;
        let currentX = 0; let currentY = 0;
        const speed = 0.03; 

        document.addEventListener('mousemove', function(e) {
            targetX = e.pageX - blockContainer.offsetWidth / 2;
            targetY = e.pageY - blockContainer.offsetHeight / 2;
        });

        function moveBlock() {
            currentX += (targetX - currentX) * speed;
            currentY += (targetY - currentY) * speed;
            blockContainer.style.left = currentX + 'px';
            blockContainer.style.top = currentY + 'px';
            requestAnimationFrame(moveBlock);
        }
        moveBlock();
    </script>

    <script>
        /* -- Text effect -- */
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        let interval = null;
        document.querySelectorAll(".effect").forEach(element => {
            element.onmouseover = event => {
                let iteration = 0;
                clearInterval(interval);
                interval = setInterval(() => {
                    event.target.innerText = event.target.innerText
                        .split("")
                        .map((letter, index) => {
                            if(index < iteration) {
                                return event.target.dataset.value[index];
                            }
                            return letters[Math.floor(Math.random() * 26)]
                        })
                        .join("");
                    
                    if(iteration >= event.target.dataset.value.length){
                        clearInterval(interval);
                    }
                    iteration += 1 / 3;
                }, 30);
            }
        });
    </script>
</body>
</html>
